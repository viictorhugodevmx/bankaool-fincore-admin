<main class="dashboard-page">
  <section class="dashboard-page__hero">
    <div>
      <span>Bankaool FinCore 360</span>
      <h1>Fintech Operations Dashboard</h1>
      <p>
        Admin shell placeholder. In the next steps this dashboard will consume
        the backend summary endpoint.
      </p>
    </div>

    <div class="dashboard-page__actions">
      @if (user(); as currentUser) {
        <span>{{ currentUser.name }} · {{ currentUser.role }}</span>
      }

      <button type="button" (click)="logout()">Logout</button>
    </div>
  </section>

  <section class="dashboard-page__grid">
    <a routerLink="/customers">Customers</a>
    <a routerLink="/accounts">Accounts</a>
    <a routerLink="/transfers">Transfers</a>
    <a routerLink="/operations">Operations</a>
    <a routerLink="/audit">Audit Logs</a>
  </section>
</main>
